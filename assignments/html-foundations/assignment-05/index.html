<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Theophilus Jacob">
        <meta name="description" content="This is the fifth assignment in the second module of the tech prophet free mentorship class">
        <title>Assignment 2.5 - Accessible Profile Images and Media</title>
    </head>
    <body>
        <img
        src="./images/profile.jpg"
        alt="Stylish man in coat with glasses and smartphone beside a vintage car in the city."
        width="256"
        height="320"
        />
    <figure>
        <img 
        src="images/wolf.jpg"
        width="320"
        height="213"
        />
        <figcaption>
        Gray wolf portrait in a dark green forest.
        </figcaption>
    </figure>

    <h2>Audio Embedded</h2>
    <audio
        controls 
        src="music/instrumental.mp3">
    </audio>

    <h2>Video Embedded</h2>
    <video 
        controls muted width="320" height="240">
        <source
            src="video/video.mp4"    
            type="video/mp4"
            />
        
        <source 
            src="video/video.webm"
            type="video/webm" 
            />

        <p>This page provide the same video in a mp4 and webm format in case of network or browser compatibility</p>
    </video>
    </body>
</html>
