<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Theophilus Jacob">
        <title>Assignment 2.8 - Accessible Mentorship Application Form</title>

    </head>
    <body>
        <h1>Tech Prophet Free Mentorship Application Form</h1>
        <!--
    This is an illustrative endpoint because no
    backend has been implemented for this assignment.
-->
        <form action="./submit_application" method="POST">
            <fieldset>
                <legend>Personal Information</legend>
                    <p>
                        <label for="name"> Full Name: </label>
                        <input type="text" name="name" id="name" required />
                    </p>
                    <p>
                        <label for="email"> Email Address: </label>
                        <input type="email" name="email" id="email" required />

                        <label for="phone-number"> Phone Number: </label>
                        <input type="tel" name="phone-number"  id="phone-number" required />
                    </p>
                    <p>
                        <label for="dob">Date of Birth:</label>
                        <input type="date" id="dob" name="dob" required />
                    </p>

                    <fieldset>
                        <legend>Gender</legend>
                        <input type="radio" id="gender-male" name="gender" value="male" />
                        <label for="gender-male">Male</label>

                        <input type="radio" id="gender-female" name="gender" value="female" />
                        <label for="gender-female">Female</label>

                        <input type="radio" id="gender-unknown" name="gender" value="prefer-not-to-say"/>
                        <label for="gender-unknown">Prefer Not to Say</label>
                    </fieldset>                
    
                </fieldset>

                <fieldset>
                    <legend>Development Information</legend>

                    <label for="experience">Current experience level</label>
                        <select id="experience" name="experience_level" required>
                            <option value="" selected disabled>Choose Your Experience Level</option>
                            <option value="beginner">Beginner</option>
                            <option value="intermediate">Intermediate</option>
                            <option value="advanced">Advanced</option>
                        </select>                    
                    
                    <fieldset>
                    <legend>Areas of Interest</legend>
                        <input type="checkbox" id="ai" name="interest" value="ai-engineering" />
                        <label for="ai">AI Engineering</label>

                        <input type="checkbox" name="interest" id="backend" value="backend" />
                        <label for="backend">Backend Engineering</label>

                        <input type="checkbox" name="interest" id="cyber" value="cyber" />
                        <label for="cyber">Cyber Security</label>

                        <input type="checkbox" name="interest" id="data" value="data-science" />
                        <label for="data">Data Science</label><br>

                        <input type="checkbox" name="interest" id="full" value="full-stack" />
                        <label for="full">Full Stack Software Engineering</label>

                        <input type="checkbox" name="interest" id="ml" value="ml" />
                        <label for="ml">Machine Learning</label>

                        <input type="checkbox" name="interest" id="ui-ux" value="ui-ux" />
                        <label for="ui-ux">UI/UX</label>
                    </fieldset>

                        <p>
                            <label for="track" >Preferred Learning Track</label>
                            <select id="track" name="track" required>
                                <option value="" selected disabled>Select a preferred learning track</option>
                                <option value="ai-engineering">AI Engineering</option>
                                <option value="backend-development">Backend Development</option>
                                <option value="cybersecurity">Cyber Security</option>
                                <option value="frontend-development">Frontend Development</option>
                                <option value="full-stack-development">Full Stack Development</option>
                            </select>  
                        </p>                     
                        
                        <p>
                            <label for="url">GitHub Profile Url</label>
                            <input type="url" name="github-url" id="url" required />
                        </p>
                   </fieldset>                                         
                   

                     <fieldset>
                        <legend>Motivation</legend>
                        <label for="motivation" >Why do you want to join the mentorship?</label>
                        <textarea id="motivation" required maxlength="500" name="why" rows="5" cols="40"></textarea>
                    </fieldset>
                
                <fieldset>
                    <legend>Mentorship Rules Agreement</legend>
                    <input type="checkbox" name="agreement" id="agreement" value="yes" required />
                    <label for="agreement">I have read and agree to the mentorship rules.</label>
                </fieldset>
                
                <fieldset>
                            <legend>Availability</legend>
                            
                            <input type="radio" id="onsite" name="availability" value="onsite" />
                            <label for="onsite">Onsite</label>

                            <input type="radio" id="online" name="availability" value="online" />
                            <label for="online">Online</label>
                </fieldset>         
           
            <button type="submit">Submit Application</button>
        </form>
    </body>
</html>
