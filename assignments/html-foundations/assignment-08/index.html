<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Theophilus Jacob">
        <title>Assignment 2.8 - Accessible Mentorship Application Form</title>

    </head>
    <body>
        <h1>Tech Prophet Free Mentorship Application Form</h1>
        <form action="./submit_application" method="POST">
            <fieldset>
                <legend>Personal Information (All Information Required)</legend>
                    <p>
                        <label for="name"> Full Name: </label>
                        <input type="text" name="name" id="name" required />
                    </p>
                    <p>
                        <label for="email"> Email Address: </label>
                        <input type="email" name="email" id="email" required />

                        <label for="phone-number"> Phone Number: </label>
                        <input type="tel" name="phone-number"  id="phone-number" required />
                    </p>
                    <p>
                        <label for="dob">Date of Birth:</label>
                        <input type="date" id="dob" name="dob" required />
                    </p>

                    <fieldset>
                        <legend>Gender</legend>
                        <input type="radio" id="gender-male" name="gender" value="male" checked />
                        <label for="gender-male">Male</label>

                        <input type="radio" id="gender-female" name="gender" value="female" />
                        <label for="gender-female">Female</label>

                        <input type="radio" id="gender-unknown" name="gender" value="prefer-not-to-say"/>
                        <label for="gender-unknown">Prefer Not to Say</label>
                    </fieldset>                
    
                </fieldset>

                <fieldset>
                    <legend>Development Information</legend>
                    <label>Current Experience Level</label>

                    <input type="radio" id="beginner" name="experience" value= "beginner" checked/>
                    <label for="beginner">Beginner</label>

                    <input type="radio" id="intermediate" name="experience" value="intermediate" />
                    <label for="intermediate">Intermediate</label>

                    <input type="radio" id="advanced" name="experience" value="advanced" />
                    <label for="advanced">Advanced</label>                   
                </fieldset>
                   
            </fieldset>
            <fieldset>
                <legend>Other</legend>
                <p>
                    <label>
                        Availability
                        <input type="radio" value="onsite" id="onsite" name="availability"/>
                        <label for= "onsite">On-site</label>
                        <input type="radio"  value = "online" name="availability" id ="online" />
                        <label for="online">Online</label>
                    </label>                    
                </p>

                <p>
                    <legend>Agreement to mentorship rules</legend>
                        <input type="radio" id="yes" value="yes" name = "agreement" required />
                        <label for="yes" >Yes</label>
                </p>
            </fieldset>                                                  

            <button type="submit">Submit Application</button>
        </form>
    </body>
</html>
