<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Theophilus Jacob">
        <title>Assignment 2.8 - Accessible Mentorship Application Form</title>

    </head>
    <body>
        <h1>Tech Prophet Free Mentorship Application Form</h1>
        <form action="./submit_application" method="POST">
            <fieldset>
            <legend>Personal Information (All Information Required)</legend>
                <p>
                    <label for="name"> Full Name: </label>
                    <input type="text" name="name" id="name" required />
                </p>
                <p>
                    <label for="email"> Email Address: </label>
                    <input type="email" name="email" id="email" required />

                    <label for="phone-number"> Phone Number: </label>
                    <input type="tel" name="phone-number"  id="phone-number" required />
                </p>
                <p>
                    <label for="dob">Date of Birth:</label>
                    <input type="date" id="dob" name="dob" required />

                <fieldset>
                    <legend>Gender</legend>
                    <!-- <label for="dob"> Gender</label> -->
                    <input type="radio" id="gender-male" name="gender" value="gender-male" checked />
                    <label for="gender-male">Male</label>

                    <input type="radio" id="gender-female" name="gender" value="gender-female" />
                    <label for="gender-female">Female</label>

                    <input type="radio" id="gender-unknown" name="gender" value="gender-unknown"/>
                    <label for="gender-unknown">Prefer Not to Say</label>
                </fieldset>                
    
                </fieldset>

                <fieldset>
                    <legend>Development Information</legend>

                    <label>
                        Current Experience Level:
                    <select>
                        <option value=""> Please choose an option</option>
                        <option value="Beginner">Beginner</option>
                        <option value="Intermediate">Intermediate</option>
                        <option value="Expert">Expert</option>
                    </select>
                    </label>
                    <p>
                        <label>
                            Area of Interest:
                            <label value="Machine Learning"> 
                                Machine Learning
                                <input type="checkbox" />                      
                            </label>

                            <label value="Cybersecurity">
                                Cybersecurity
                                <input type="checkbox" />
                            </label>
                            <label value="ai-engineering">
                                AI Engineering
                                <input type="checkbox" />
                            </label>
                            <label value="Full-stack">
                                Full Stack Software Engineering
                                <input type="checkbox" />
                            </label>

                        </label>
                    </p>
                </fieldset>        
                

            <h2>Other</h2>
            <button type="submit" >Submit Application</button>
        </form>
    </body>
</html>
