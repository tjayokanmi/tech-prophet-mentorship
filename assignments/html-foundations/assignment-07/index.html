<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Theophilus Jacob">
        <title>Results and Timetable Data Tables</title>
        <!-- <link href="minimal-table.css" rel="stylesheet" type="text/css"> -->
    </head>
    <body>  
        <h1>Results and Timetable Data Tables</h1>
        <table>
            <caption>Table 1: Student results</caption>
            <thead>
                <tr>
                    <th scope="col">Student</th>
                    <th scope="col">HTML</th>
                    <th scope="col">CSS</th>
                    <th scope="col">JavaScript</th>
                    <th scope="col">Total</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th scope="row">Ada</th>
                    <td>82</td>
                    <td>71</td>
                    <td>69</td>
                    <td>222</td>
                </tr>
                <tr>
                    <th scope="row">Musa</th>
                    <td>75</td>
                    <td>81</td>
                    <td>74</td>
                    <td>230</td>
                </tr>
                <tr>
                    <th scope="row">Grace</th>
                    <td>91</td>
                    <td>88</td>
                    <td>80</td>
                    <td>259</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <th scope="row">Class Total</th>
                    <td>248</td>
                    <td>240</td>
                    <td>223</td>
                    <td>711</td>
                </tr>
            </tfoot>
        </table>
    </body>
</html>
